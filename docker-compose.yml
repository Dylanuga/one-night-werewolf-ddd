
services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_SOCKET_URL=http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      - backend
