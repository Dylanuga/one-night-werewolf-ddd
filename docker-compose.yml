
services:
  backend:
    build:
      context: ./backend
    expose:
      - "5000"
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_DEBUG=${FLASK_DEBUG:-true}
      - SECRET_KEY=${SECRET_KEY:-}
      - ENABLE_TEST_ENDPOINTS=${ENABLE_TEST_ENDPOINTS:-true}

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_SOCKET_URL=
        - VITE_ENABLE_TESTING=${VITE_ENABLE_TESTING:-true}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
